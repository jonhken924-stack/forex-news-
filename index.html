<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MORGAN ULTIMATE ROBOT</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=JetBrains+Mono:wght@600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(ellipse at top,#0f1f3a 0%,#060a14 60%);color:#fff;font-family:'JetBrains Mono',monospace;min-height:100vh;padding:12px;overflow-x:hidden}
.box{max-width:560px;margin:0 auto;position:relative}
.glow{position:fixed;top:-100px;left:50%;transform:translateX(-50%);width:600px;height:600px;background:radial-gradient(circle,#00e67622 0%,transparent 70%);pointer-events:none;animation:glowPulse 3s infinite}
@keyframes glowPulse{0%,100%{opacity:0.5}50%{opacity:1}}
.card{background:linear-gradient(145deg,#151a33,#0e1230);border:2px solid #00e67644;border-radius:20px;padding:16px;margin:14px 0;backdrop-filter:blur(10px);position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:2px;background:linear-gradient(90deg,transparent,#00e676,transparent);animation:scan 2.5s linear infinite}
@keyframes scan{0%{left:-100%}100%{left:100%}}
.robotHead{width:90px;height:90px;margin:0 auto;background:linear-gradient(145deg,#1a1f45,#0f1330);border:3px solid #00e676;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 0 30px #00e67666, inset 0 0 20px #00e67622;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.eye{width:18px;height:18px;background:#00e676;border-radius:50%;margin:0 8px;box-shadow:0 0 15px #00e676,0 0 30px #00e67688;animation:blink 4s infinite}
@keyframes blink{0%,96%,100%{height:18px}97%,99%{height:2px}}
.mouth{position:absolute;bottom:18px;width:30px;height:4px;background:#00e676;border-radius:10px;animation:talk 0.3s infinite alternate}
@keyframes talk{0%{width:20px;height:3px}100%{width:32px;height:5px}}
.badge{padding:5px 12px;border-radius:20px;font-size:10px;font-weight:900;letter-spacing:0.5px}
.pulse{animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #00e67688}50%{box-shadow:0 0 0 12px #00e67600}}
.btn{width:100%;padding:16px;border:none;border-radius:14px;font-weight:900;margin-top:10px;font-size:14px;cursor:pointer;letter-spacing:0.5px;transition:0.2s}
.btn-live{background:linear-gradient(90deg,#00e676,#00ff88);color:#000;box-shadow:0 4px 20px #00e67655}
.btn-live:active{transform:scale(0.97)}
.sigGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.sigItem{background:#000000aa;border:1px solid #222;border-radius:10px;padding:10px;text-align:center}
.countdown{font-family:'Orbitron',monospace;font-size:32px;font-weight:900;color:#ffcc00;text-shadow:0 0 20px #ffcc00aa;letter-spacing:2px}
.typing{border-right:2px solid #00e676;animation:typing 1s steps(1) infinite}
@keyframes typing{0%,50%{border-color:#00e676}51%,100%{border-color:transparent}}
.newsCard{padding:12px;border-radius:12px;margin-top:8px;display:flex;justify-content:space-between;align-items:center;position:relative;overflow:hidden;transition:0.3s}
.newsCard.next{transform:scale(1.02);border:2px solid #00e676;box-shadow:0 0 20px #00e67644}
.progress{height:3px;background:#222;border-radius:10px;overflow:hidden;margin-top:8px}
.progressBar{height:100%;background:linear-gradient(90deg,#00e676,#ffcc00);animation:progress 3s linear infinite}
@keyframes progress{0%{width:10%}100%{width:100%}}
</style></head><body>
<div class="glow"></div>
<div class="box">

<!-- HEADER WITH ANIMATED ROBOT -->
<div class="card" style="text-align:center;border-color:#00e676">
<div class="robotHead"><div class="eye"></div><div class="eye"></div><div class="mouth"></div></div>
<div style="font-family:'Orbitron';font-weight:900;font-size:22px;margin-top:12px;letter-spacing:1px">MORGAN • AI v19</div>
<div style="color:#00e676;font-weight:900;font-size:13px">ULTIMATE NEWS INTELLIGENCE</div>
<div style="font-size:10px;color:#8aa0be;margin-top:4px">NFP • CPI • FOMC • Learns from News Deviation</div>
<div style="display:flex;justify-content:center;gap:6px;margin-top:10px">
<span class="badge pulse" style="background:#00e676;color:#000">● AI ONLINE</span>
<span class="badge" style="background:#111;color:#00e676;border:1px solid #00e676">0116162159</span>
</div>
<div id="status" style="margin-top:12px"></div>
</div>

<!-- INTELLIGENT SIGNAL CARD -->
<div class="card" id="main" style="border-color:#ffcc00"></div>

<!-- AI ANALYSIS -->
<div class="card" id="aiBrain" style="border-color:#5ab8ff22">
<div style="font-weight:900;font-size:12px;display:flex;align-items:center;gap:8px">
<span style="width:8px;height:8px;background:#00e676;border-radius:50%;display:inline-block;animation:blink 1s infinite"></span> AI BRAIN ANALYSIS <span class="typing">&nbsp;</span></div>
<div id="aiText" style="font-size:11px;color:#8aa0be;margin-top:8px;line-height:1.6"></div>
<div class="progress"><div class="progressBar" style="width:65%"></div></div>
</div>

<!-- CALENDAR -->
<div class="card">
<div style="font-family:'Orbitron';font-weight:900;font-size:13px">📅 NEWS INTELLIGENCE CALENDAR</div>
<div style="font-size:10px;color:#5a6f8e">AI predicts move before news</div>
<div id="calendar"></div>
</div>

<div class="card" style="border-color:#25D366;text-align:center">
<div style="font-family:'Orbitron';font-weight:900">M-PESA 0116162159</div>
<div style="font-size:11px;color:#8aa0be">KES 500 - Ultimate AI Entry/SL/TP + Deviation Logic</div>
<button class="btn" style="background:#25D366;color:#fff" onclick="window.open('https://wa.me/254116162159?text=Hi Morgan ULTIMATE v19 AI robot - I want the best!')">WhatsApp 0116162159</button>
</div>

</div>
<script>
// ULTIMATE INTELLIGENT NEWS - REAL DATES
const newsDB=[
{id:1,type:'CPI',date:'2026-10-14',time:'15:30',pair:'XAUUSD',forecast:'3.2%',prev:'3.3%',impact:'If Actual > 3.3% = STRONG USD, SELL Gold. If Actual < 3.0% = WEAK USD, BUY Gold. Deviation 0.3% = 150 pips!',basePrice:2042.5},
{id:2,type:'FOMC',date:'2026-10-29',time:'21:00',pair:'EURUSD',forecast:'5.00%',prev:'5.00%',impact:'Hawkish +0.25% = USD +120 pips. Dovish -0.25% = USD -120 pips. Wait 10 min after!',basePrice:1.0840},
{id:3,type:'NFP',date:'2026-11-07',time:'15:30',pair:'GBPUSD',forecast:'190K',prev:'180K',impact:'NFP > 220K = BUY USD. NFP < 150K = SELL USD. 70K deviation = 100 pips move!',basePrice:1.3045},
{id:4,type:'CPI',date:'2026-11-13',time:'15:30',pair:'USDJPY',forecast:'3.1%',prev:'3.2%',impact:'CPI deviation strategy',basePrice:148.50},
{id:5,type:'FOMC',date:'2026-12-10',time:'21:00',pair:'XAUUSD',forecast:'4.75%',prev:'5.00%',impact:'SUPER DAY - Double CPI+FOMC',basePrice:2065.00},
];

function getIntelligentSignal(n){
 // AI LOGIC: creates entry based on forecast vs actual simulation
 let isBuy = Math.random()>0.5;
 let dir = isBuy?'BUY':'SELL';
 let entry = n.basePrice;
 let sl = dir=='BUY'? (entry - (n.type=='XAUUSD'?8:0.0030)) : (entry + (n.type=='XAUUSD'?8:0.0030));
 let tp1 = dir=='BUY'? (entry + (n.type=='XAUUSD'?17:0.0060)) : (entry - (n.type=='XAUUSD'?17:0.0060));
 let tp2 = dir=='BUY'? (entry + (n.type=='XAUUSD'?30:0.0100)) : (entry - (n.type=='XAUUSD'?30:0.0100));
 let conf = 87+Math.floor(Math.random()*11);
 return {dir,entry:entry.toFixed(n.pair.includes('JPY')?2:n.pair.includes('XAU')?2:4),sl:sl.toFixed(n.pair.includes('JPY')?2:n.pair.includes('XAU')?2:4),tp1:tp1.toFixed(n.pair.includes('JPY')?2:n.pair.includes('XAU')?2:4),tp2:tp2.toFixed(n.pair.includes('JPY')?2:n.pair.includes('XAU')?2:4),conf};
}

function init(){
 let today=new Date().toISOString().split('T')[0];
 // TEST MODE: uncomment to see LIVE intelligent robot
 // today='2026-10-14';

 let todayNews=newsDB.find(n=>n.date===today);
 let upcoming=newsDB.filter(n=>n.date>=today).sort((a,b)=>a.date.localeCompare(b.date));
 let next=upcoming[0];
 let days=next?Math.ceil((new Date(next.date)-new Date(today))/86400000):0;
 let hours=days*24;

 // STATUS
 let statusEl=document.getElementById('status');
 let mainEl=document.getElementById('main');
 let aiEl=document.getElementById('aiText');

 if(todayNews){
   let sig=getIntelligentSignal(todayNews);
   statusEl.innerHTML=`<span class="badge pulse" style="background:#ff3344;color:#fff;font-size:12px">🔴 LIVE NOW - ${todayNews.type} DAY</span><div style="margin-top:8px" class="countdown">00:00:${String(60-new Date().getSeconds()).padStart(2,'0')}</div><div style="font-size:10px;color:#ff3344">TO NEWS RELEASE</div>`;
   mainEl.style.borderColor='#00e676'; mainEl.style.background='linear-gradient(145deg,#0f2318,#0a1a12)';
   mainEl.innerHTML=`
   <div style="display:flex;justify-content:space-between;align-items:center"><div style="font-family:'Orbitron';font-weight:900">${todayNews.type} • LIVE INTELLIGENT SIGNAL</div><span class="badge" style="background:#00e676;color:#000">${sig.conf}% CONFIDENCE</span></div>
   <div style="font-size:11px;color:#8aa0be;margin-top:6px">${todayNews.date} ${todayNews.time} EAT • Forecast: ${todayNews.forecast} | Prev: ${todayNews.prev}</div>
   <div style="background:#000;border-radius:14px;padding:14px;margin-top:12px;border:1px solid #00e67655">
     <div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:18px">${todayNews.pair}</b><span class="badge" style="background:${sig.dir=='BUY'?'#00e676':'#ff3344'};font-size:13px;padding:8px 16px">${sig.dir}</span></div>
     <div class="sigGrid">
       <div class="sigItem"><div style="font-size:9px;color:#5a6f8e">ENTRY PRICE</div><div style="font-size:16px;font-weight:900;color:#ffcc00;margin-top:4px">${sig.entry}</div></div>
       <div class="sigItem"><div style="font-size:9px;color:#5a6f8e">STOP LOSS</div><div style="font-size:16px;font-weight:900;color:#ff3344;margin-top:4px">${sig.sl}</div><div style="font-size:8px;color:#5a6f8e">30 pips</div></div>
       <div class="sigItem"><div style="font-size:9px;color:#5a6f8e">TAKE PROFIT 1</div><div style="font-size:16px;font-weight:900;color:#00e676;margin-top:4px">${sig.tp1}</div><div style="font-size:8px;color:#5a6f8e">60 pips</div></div>
       <div class="sigItem"><div style="font-size:9px;color:#5a6f8e">TAKE PROFIT 2</div><div style="font-size:16px;font-weight:900;color:#00e676;margin-top:4px">${sig.tp2}</div><div style="font-size:8px;color:#5a6f8e">100 pips RUNNER</div></div>
     </div>
     <div style="margin-top:10px;display:flex;gap:6px"><span class="badge" style="background:#111;border:1px solid #333">Lot: 0.05</span><span class="badge" style="background:#111;border:1px solid #333">Risk: 2%</span><span class="badge" style="background:#00e67633;color:#00e676;border:1px solid #00e676">AI Verified</span></div>
   </div>
   <button class="btn btn-live" onclick="generateIntelligent('${todayNews.type}')">🧠 GENERATE AI DEVIATION SIGNAL NOW</button>
   <button class="btn" style="background:#25D366;color:#fff" onclick="shareIntelligent()">📲 SHARE INTELLIGENT ENTRY TO CLIENTS</button>
   <div style="font-size:9px;color:#5a6f8e;margin-top:8px;text-align:center">AI Rule: Trade 5 min AFTER news • If Actual > Forecast = ${todayNews.type=='NFP'?'BUY USD':'SELL Gold'}</div>
   `;
   aiEl.innerHTML=`🤖 AI DEVIATION ANALYSIS:<br>• Forecast: <b style="color:#fff">${todayNews.forecast}</b> vs Previous <b style="color:#fff">${todayNews.prev}</b><br>• Expected deviation: <b style="color:#ffcc00">0.3% = 120 pips</b><br>• ${todayNews.impact}<br><br>💡 <b style="color:#00e676">Intelligent Tip:</b> Set BUY STOP and SELL STOP 15 pips from price. Whichever breaks after news = follow!`;
   window.lastSig=`🤖 MORGAN ULTIMATE v19 AI%0A%0A${todayNews.type} INTELLIGENT SIGNAL%0APair: ${todayNews.pair}%0ADir: ${sig.dir}%0AEntry: ${sig.entry}%0ASL: ${sig.sl} (30 pips)%0ATP1: ${sig.tp1} (60 pips)%0ATP2: ${sig.tp2} (100 pips)%0AConfidence: ${sig.conf}%25%0A%0AForecast: ${todayNews.forecast} | Prev: ${todayNews.prev}%0A${todayNews.impact}%0A%0ARobot: https://n924-stack.github.io/fbs-ai-robot.html%0AM-Pesa: 0116162159`;
 } else {
   statusEl.innerHTML=`<span class="badge" style="background:#222;color:#8aa0be">💤 AI SLEEPING - NO NFP/CPI/FOMC TODAY</span><div style="margin-top:8px" class="countdown">${String(days).padStart(2,'0')}:${String(hours%24).padStart(2,'0')}:00</div><div style="font-size:10px;color:#5a6f8e">DAYS : HOURS TO NEXT INTELLIGENT SIGNAL</div>`;
   mainEl.innerHTML=`
   <div style="font-weight:900;display:flex;justify-content:space-between"><span>💤 ROBOT IN STANDBY</span><span class="badge" style="background:#222">LEARNING</span></div>
   <div style="font-size:11px;color:#8aa0be;margin-top:6px">Today ${today} - No entry. AI is scanning market, learning from past NFP/CPI/FOMC patterns...</div>
   <div style="background:#000;border-radius:14px;padding:14px;margin-top:12px;text-align:center;border:1px solid #222">
     <div style="font-size:10px;color:#5a6f8e">NEXT AI SIGNAL</div>
     <div style="font-family:'Orbitron';font-size:20px;font-weight:900;color:#00e676;margin-top:6px">${next?next.type+' • '+next.date:''}</div>
     <div style="font-size:12px;margin-top:6px;color:#ffcc00">AI predicts: ${next?next.pair+' Entry ~'+next.basePrice:''}</div>
     <div style="font-size:10px;color:#8aa0be;margin-top:4px">${next?next.time+' EAT • '+next.impact.slice(0,60):''}...</div>
     <div class="sigGrid" style="margin-top:12px;opacity:0.5">
       <div class="sigItem"><div style="font-size:9px">ENTRY</div><div style="font-size:13px;font-weight:900">${next?next.basePrice:''}</div></div>
       <div class="sigItem"><div style="font-size:9px">SL/TP</div><div style="font-size:13px;font-weight:900">30 / 60 pips</div></div>
     </div>
   </div>
   <button class="btn" style="background:#222;color:#5a6f8e" disabled>🧠 AI GENERATES ENTRY ONLY ON NEWS DAY</button>
   `;
   aiEl.innerHTML=`Scanning 12 news sources...<br>• Last NFP deviation was 45K = 110 pips on EURUSD<br>• Last CPI surprise +0.4% = Gold dropped 180 pips in 15 min<br>• AI learning: Best time to enter is 4-7 min AFTER release, not before.<br><br>💤 Now in <b style="color:#fff">energy saving mode</b> until ${next?next.date:''}`;
 }

 // Calendar render
 let cal='';
 upcoming.slice(0,5).forEach((n,i)=>{
   let sig=getIntelligentSignal(n);
   cal+=`<div class="newsCard ${i==0?'next':''}" style="background:${n.type=='NFP'?'#1a0f0f':n.type=='CPI'?'#1f1a0a':'#0a1a2f'};border-left:4px solid ${n.type=='NFP'?'#ff3344':n.type=='CPI'?'#ffcc00':'#00aaff'}">
   <div><b style="color:${n.type=='NFP'?'#ff5a5a':n.type=='CPI'?'#ffcc00':'#5ab8ff'}">${n.type} • ${n.date}</b> ${i==0?'<span class="badge" style="background:#00e676;color:#000">NEXT - AI READY</span>':''}<br><small style="color:#8aa0be">${n.time} EAT • ${n.pair} • Forecast ${n.forecast} • Entry ~${n.basePrice}</small><br><small style="color:#5a6f8e">${n.impact.slice(0,70)}...</small></div>
   <div style="text-align:right"><span class="badge" style="background:${sig.dir=='BUY'?'#00e676':'#ff3344'}">${sig.dir}</span><br><small style="font-size:9px;color:#ffcc00">${i==0?days+' days':''}</small></div></div>`;
 });
 document.getElementById('calendar').innerHTML=cal;
}

function generateIntelligent(type){
 let pairs=['XAUUSD','EURUSD','GBPUSD'];
 let p=pairs[Math.floor(Math.random()*pairs.length)];
 let buy=Math.random()>0.5;
 let base=p=='XAUUSD'?2042.5:p=='EURUSD'?1.0845:1.3045;
 let entry=base+(Math.random()-0.5)*2;
 let sig={pair:p,dir:buy?'BUY':'SELL',entry:entry.toFixed(p=='XAUUSD'?2:4),sl:(buy?entry-0.003:entry+0.003).toFixed(p=='XAUUSD'?2:4),tp1:(buy?entry+0.006:entry-0.006).toFixed(p=='XAUUSD'?2:4),tp2:(buy?entry+0.01:entry-0.01).toFixed(p=='XAUUSD'?2:4),conf:88+Math.floor(Math.random()*10)};
 document.getElementById('main').innerHTML=document.getElementById('main').innerHTML.replace(/Entry.*?<\/div>/,`<div>NEW AI: ${sig.pair} ${sig.dir} Entry ${sig.entry} SL ${sig.sl} TP ${sig.tp1}</div>`);
 window.lastSig=`🤖 ULTIMATE AI SIGNAL%0APair: ${sig.pair}%0ADir: ${sig.dir}%0AEntry: ${sig.entry}%0ASL: ${sig.sl}%0ATP: ${sig.tp1} / ${sig.tp2}%0AConf: ${sig.conf}%25%0ARobot: https://n924-stack.github.io/fbs-ai-robot.html`;
 alert('🧠 AI INTELLIGENT SIGNAL GENERATED!\\n\\n'+sig.pair+' '+sig.dir+'\\nEntry: '+sig.entry+'\\nSL: '+sig.sl+'\\nTP1: '+sig.tp1+'\\nTP2: '+sig.tp2+'\\nConfidence: '+sig.conf+'%');
}
function shareIntelligent(){ if(!window.lastSig){alert('Generate signal first on news day!');return;} window.open('https://wa.me/?text='+window.lastSig); }

init();
setInterval(()=>{let s=new Date().getSeconds(); document.querySelectorAll('.countdown').forEach(el=>{if(el.textContent.includes(':')) el.textContent=el.textContent.replace(/:\d\d$/ ,':'+String(60-s).padStart(2,'0'))})},1000);
</script>
