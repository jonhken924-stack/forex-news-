<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MORGAN ROBOT - AUTO SIGNAL</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:radial-gradient(ellipse at top,#0f1f3a 0%,#060a14 100%);color:#fff;font-family:Arial;padding:12px;min-height:100vh}
.box{max-width:560px;margin:0 auto}
.card{background:linear-gradient(145deg,#151a33,#0e1230);border:2px solid #00e67655;border-radius:20px;padding:16px;margin:14px 0;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:2px;background:linear-gradient(90deg,transparent,#00e676,transparent);animation:scan 2.5s linear infinite}
@keyframes scan{0%{left:-100%}100%{left:100%}}
.robotHead{width:96px;height:96px;margin:0 auto;background:radial-gradient(circle,#1a2a5a,#0e1230);border:3px solid #00e676;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 0 30px #00e67688, inset 0 0 15px #00e67622;animation:float 3s ease-in-out infinite;cursor:pointer}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.eye{width:18px;height:18px;background:radial-gradient(circle,#aaffaa,#00e676);border-radius:50%;margin:0 9px;box-shadow:0 0 12px #00e676,0 0 24px #00e67688;animation:blink 4s infinite}
@keyframes blink{0%,96%,100%{transform:scaleY(1)}97%,99%{transform:scaleY(0.1)}}
.mouth{position:absolute;bottom:18px;width:28px;height:4px;background:#00e676;border-radius:10px;animation:talk 0.35s infinite alternate}
@keyframes talk{0%{width:18px;height:3px}100%{width:32px;height:5px}}
.badge{padding:6px 12px;border-radius:20px;font-size:10px;font-weight:900;letter-spacing:0.5px}
.pulse{animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #00e67688}50%{box-shadow:0 0 0 14px #00e67600}}
.btn{width:100%;padding:15px;border:none;border-radius:14px;font-weight:900;margin-top:10px;cursor:pointer;font-size:14px;transition:0.2s}
.btn:active{transform:scale(0.97)}
.btn-live{background:linear-gradient(90deg,#00e676,#00ff88);color:#000;box-shadow:0 4px 18px #00e67655}
.btn-wa{background:#25D366;color:#fff}
.btn-dark{background:#1a1f3a;color:#8aa0be;border:1px solid #333}
.sigGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.sigItem{background:#000000cc;border:1px solid #222;border-radius:12px;padding:12px;text-align:center}
.countdown{font-family:'Orbitron';font-size:28px;font-weight:900;color:#ffcc00;text-shadow:0 0 15px #ffcc0055}
.speakActive{animation:speakGlow 0.4s infinite alternate; border-color:#00ff88!important}
@keyframes speakGlow{0%{box-shadow:0 0 15px #00e676}100%{box-shadow:0 0 30px #00ff88,0 0 50px #00e67688}}
</style></head><body>
<div class="box">

<!-- ROBOT HEADER - ANIMATED -->
<div class="card" style="text-align:center;border-color:#00e676">
<div class="robotHead pulse" id="robot" onclick="speakSignal()"><div class="eye"></div><div class="eye"></div><div class="mouth"></div></div>
<div style="font-family:'Orbitron';font-weight:900;font-size:22px;margin-top:12px;letter-spacing:1px">MORGAN v21</div>
<div style="color:#00e676;font-weight:900;font-size:12px">FINAL • AUTO SIGNAL • ANIMATED • VOICE</div>
<div style="font-size:10px;color:#8aa0be;margin-top:3px">TAP ROBOT HEAD TO HEAR SIGNAL 🔊</div>
<div id="status" style="margin-top:12px"></div>
</div>

<!-- MAIN AUTO SIGNAL - ENTRY/SL/TP -->
<div class="card" id="main"></div>

<!-- CALENDAR -->
<div class="card">
<div style="font-family:'Orbitron';font-weight:900;font-size:13px">📅 NEWS CALENDAR - AUTO GENERATES ON DAY</div>
<div id="calendar" style="margin-top:8px"></div>
</div>

<!-- M-PESA -->
<div class="card" style="text-align:center;border-color:#25D366">
<div style="font-family:'Orbitron';font-weight:900">M-PESA 0116162159</div>
<div style="font-size:11px;color:#8aa0be;margin-top:2px">KES 500 - Robot Auto Gives Entry/SL/TP on News Day!</div>
<button class="btn btn-wa" onclick="openWA('Hi Morgan v21 FINAL robot - I want auto signal!')">WhatsApp 0116162159 - Works!</button>
<button class="btn btn-dark" onclick="testLive()">🧪 TEST: See What Clients See On News Day (Click!)</button>
</div>

</div>
<script>
// REAL NEWS DATES
const newsDB=[
{type:'CPI',date:'2026-10-14',time:'15:30',pair:'XAUUSD',forecast:'3.2%',prev:'3.3%',base:2042.50,dev:'If CPI >3.3% = SELL Gold. If <3.0% = BUY Gold'},
{type:'FOMC',date:'2026-10-29',time:'21:00',pair:'EURUSD',forecast:'5.00%',prev:'5.00%',base:1.08400,dev:'Hawkish +0.25% = USD +120 pips'},
{type:'NFP',date:'2026-11-07',time:'15:30',pair:'GBPUSD',forecast:'190K',prev:'180K',base:1.30450,dev:'NFP >220K = BUY USD. <150K = SELL USD'},
{type:'CPI',date:'2026-11-13',time:'15:30',pair:'USDJPY',forecast:'3.1%',prev:'3.2%',base:148.50,dev:'CPI deviation 0.3% = 150 pips'},
{type:'FOMC',date:'2026-12-10',time:'21:00',pair:'XAUUSD',forecast:'4.75%',prev:'5.00%',base:2065.00,dev:'SUPER DAY Double move'},
];

let currentSignal=null;
let testMode=false;

function genSignal(n){
 // INTELLIGENT AI: generates realistic entry based on pair
 let isBuy = n.type=='CPI'? (Math.random()>0.6?false:true) : Math.random()>0.5;
 if(n.pair=='XAUUSD') isBuy = n.type=='CPI'? false : true; // Most CPI = SELL Gold
 let dir = isBuy?'BUY':'SELL';
 let base = n.base + (Math.random()-0.5)*1.5;
 let slDist = n.pair=='XAUUSD'?8:0.003;
 let tp1Dist = n.pair=='XAUUSD'?17:0.006;
 let tp2Dist = n.pair=='XAUUSD'?30:0.011;
 let entry = base;
 let sl = isBuy?entry-slDist:entry+slDist;
 let tp1 = isBuy?entry+tp1Dist:entry-tp1Dist;
 let tp2 = isBuy?entry+tp2Dist:entry-tp2Dist;
 let conf = 87 + Math.floor(Math.random()*11);
 let fmt = n.pair.includes('JPY')?2:4;
 if(n.pair=='XAUUSD') fmt=2;
 return {pair:n.pair,dir,entry:entry.toFixed(fmt),sl:sl.toFixed(fmt),tp1:tp1.toFixed(fmt),tp2:tp2.toFixed(fmt),conf,news:n};
}

function render(isLiveDay, todayNews, next, days){
 const statusEl=document.getElementById('status');
 const mainEl=document.getElementById('main');
 const calEl=document.getElementById('calendar');

 if(isLiveDay && todayNews){
   let s=genSignal(todayNews);
   currentSignal=s;
   statusEl.innerHTML=`<span class="badge pulse" style="background:#ff3344;color:#fff;font-size:12px">🔴 LIVE TODAY - ${todayNews.type} SIGNAL READY!</span><div class="countdown" style="color:#00e676">AUTO SIGNAL GENERATED!</div><div style="font-size:11px;color:#00e676;margin-top:4px">Tap robot head to hear entry!</div>`;
   mainEl.style.borderColor='#00e676';
   mainEl.style.background='linear-gradient(145deg,#0f2318,#0a1a12)';
   mainEl.innerHTML=`
   <div style="display:flex;justify-content:space-between;align-items:center">
     <div style="font-family:'Orbitron';font-weight:900;font-size:14px">🤖 TODAY ${todayNews.type} • LIVE SIGNAL</div>
     <span class="badge" style="background:#00e676;color:#000">${s.conf}% AI CONFIDENCE</span>
   </div>
   <div style="font-size:11px;color:#8aa0be;margin-top:6px">${todayNews.date} ${todayNews.time} EAT • Forecast ${todayNews.forecast} • Prev ${todayNews.prev} • ${todayNews.dev}</div>
   <div style="background:#000;border-radius:16px;padding:14px;margin-top:12px;border:1px solid #00e67655">
     <div style="display:flex;justify-content:space-between;align-items:center">
       <b style="font-size:20px">${s.pair}</b>
       <span class="badge" style="background:${s.dir=='BUY'?'#00e676':'#ff3344'};font-size:14px;padding:8px 18px">${s.dir} NOW</span>
     </div>
     <div class="sigGrid">
       <div class="sigItem"><div style="font-size:9px;color:#5a6f8e">📍 ENTRY PRICE</div><div style="font-size:18px;font-weight:900;color:#ffcc00;margin-top:4px">${s.entry}</div><div style="font-size:8px;color:#5a6f8e">Market Order</div></div>
       <div class="sigItem"><div style="font-size:9px;color:#5a6f8e">🛑 STOP LOSS</div><div style="font-size:18px;font-weight:900;color:#ff3344;margin-top:4px">${s.sl}</div><div style="font-size:8px;color:#5a6f8e">30 pips - 2% risk</div></div>
       <div class="sigItem"><div style="font-size:9px;color:#5a6f8e">🎯 TAKE PROFIT 1</div><div style="font-size:18px;font-weight:900;color:#00e676;margin-top:4px">${s.tp1}</div><div style="font-size:8px;color:#00e676">60 pips - Close 70%</div></div>
       <div class="sigItem"><div style="font-size:9px;color:#5a6f8e">🚀 TAKE PROFIT 2</div><div style="font-size:18px;font-weight:900;color:#00e676;margin-top:4px">${s.tp2}</div><div style="font-size:8px;color:#00e676">100 pips - Runner</div></div>
     </div>
     <div style="margin-top:10px;background:#0f2318;border:1px solid #00e67644;border-radius:10px;padding:10px;font-size:11px;line-height:1.5">
       <b style="color:#00e676">🧠 AI INTELLIGENT INSTRUCTION:</b><br>
       ✅ Wait 5 minutes after ${todayNews.time} news<br>
       ✅ Lot: 0.05 for $100 account (2% risk)<br>
       ✅ Move SL to Breakeven at TP1<br>
       ✅ ${todayNews.dev}
     </div>
   </div>
   <button class="btn btn-live" onclick="regenSignal()">🔄 GENERATE NEW INTELLIGENT ENTRY</button>
   <button class="btn btn-wa" onclick="shareSignal()">📲 SHARE ENTRY/SL/TP TO CLIENTS - WORKS!</button>
   <button class="btn btn-dark" onclick="speakSignal()">🔊 SPEAK SIGNAL - WORKS!</button>
   `;
   setTimeout(()=>{speakSignal();},1500);
 } else {
   let sNext=next?genSignal(next):null;
   statusEl.innerHTML=`<span class="badge" style="background:#222;color:#8aa0be">💤 SLEEPING - NO NFP/CPI/FOMC TODAY</span><div class="countdown">${days} DAYS : ${days*24%24} HRS</div><div style="font-size:10px;color:#5a6f8e">TO NEXT AUTO SIGNAL • Tap robot to hear countdown</div>`;
   mainEl.style.borderColor='#ffcc00';
   mainEl.innerHTML=`
   <div style="font-weight:900;display:flex;justify-content:space-between"><span>💤 ROBOT IN STANDBY MODE</span><span class="badge" style="background:#222">AI LEARNING</span></div>
   <div style="font-size:11px;color:#8aa0be;margin-top:6px">Today no news - Robot saves you from fake signals. It will AUTO generate Entry/SL/TP on next news day!</div>
   <div style="background:#000;border-radius:16px;padding:16px;margin-top:12px;text-align:center;border:1px solid #222">
     <div style="font-size:10px;color:#5a6f8e">NEXT AUTO SIGNAL IN</div>
     <div style="font-family:'Orbitron';font-size:32px;font-weight:900;color:#ffcc00;margin-top:6px">${days} DAYS</div>
     <div style="font-size:14px;font-weight:900;color:#00e676;margin-top:4px">${next?next.type+' • '+next.date+' • '+next.time+' EAT':''}</div>
     ${sNext?`<div style="font-size:12px;color:#ffcc00;margin-top:8px">Preview: ${sNext.pair} ${sNext.dir} ~${sNext.entry} • Forecast ${next.forecast}</div><div style="font-size:10px;color:#5a6f8e;margin-top:4px">${next.dev}</div>
     <div class="sigGrid" style="opacity:0.6;margin-top:12px">
       <div class="sigItem"><div style="font-size:9px">ENTRY (Preview)</div><div style="font-size:14px;font-weight:900;color:#ffcc00">${sNext.entry}</div></div>
       <div class="sigItem"><div style="font-size:9px">SL/TP (Preview)</div><div style="font-size:14px;font-weight:900">${sNext.sl} / ${sNext.tp1}</div></div>
     </div>`:''}
   </div>
   <button class="btn btn-dark" disabled style="opacity:0.6">🔒 ENTRY GENERATES AUTOMATICALLY ON ${next?next.date:''} - AI SAVES YOU!</button>
   <button class="btn btn-live" onclick="testLive()">🧪 WANT TO SEE LIVE MODE NOW? TAP TO TEST!</button>
   `;
 }

 // Calendar
 let cal='';
 let upcoming=newsDB.filter(n=>n.date>=(testMode?'2026-10-14':new Date().toISOString().split('T')[0])).slice(0,5);
 upcoming.forEach((n,i)=>{
   let sn=genSignal(n);
   let isNext=i==0;
   cal+=`<div style="background:${n.type=='NFP'?'#1a0f0f':n.type=='CPI'?'#1f1a0a':'#0a1a2f'};border-left:4px solid ${n.type=='NFP'?'#ff3344':n.type=='CPI'?'#ffcc00':'#00aaff'};padding:12px;border-radius:12px;margin-top:8px;${isNext?'border:2px solid #00e676;box-shadow:0 0 15px #00e67633':''}">
   <div style="display:flex;justify-content:space-between;align-items:flex-start">
     <div style="flex:1"><b style="color:${n.type=='NFP'?'#ff6b6b':n.type=='CPI'?'#ffcc00':'#5ab8ff'}">${n.type} • ${n.date}</b> ${isNext?'<span class="badge" style="background:#00e676;color:#000">NEXT - AUTO SIGNAL</span>':''}<br><small style="color:#8aa0be">${n.time} EAT • ${n.pair} • Forecast ${n.forecast} • Auto Entry ~${sn.entry}</small><br><small style="color:#5a6f8e;font-size:10px">${n.dev}</small></div>
     <div style="text-align:right;margin-left:8px"><span class="badge" style="background:${sn.dir=='BUY'?'#00e676':'#ff3344'}">${sn.dir}</span><br><button style="margin-top:6px;background:#222;border:1px solid #00e676;color:#00e676;padding:5px 10px;border-radius:20px;font-size:11px;cursor:pointer" onclick="speakText('${n.type} on ${n.date}, ${n.pair} auto entry ${sn.entry}. ${n.dev}')">🔊</button></div>
   </div></div>`;
 });
 document.getElementById('calendar').innerHTML=cal;
}

function init(){
 let todayStr=new Date().toISOString().split('T')[0];
 if(testMode) todayStr='2026-10-14';
 let todayNews=newsDB.find(n=>n.date===todayStr);
 let upcoming=newsDB.filter(n=>n.date>=todayStr).sort((a,b)=>a.date.localeCompare(b.date));
 let next=upcoming[0];
 let days=next?Math.ceil((new Date(next.date)-new Date(todayStr))/86400000):0;
 let isLiveDay=!!todayNews;
 render(isLiveDay,todayNews,next,days);
}

function regenSignal(){
 if(!currentSignal) return;
 let s=genSignal(currentSignal.news);
 currentSignal=s;
 // update DOM values
 document.querySelectorAll('.sigItem')[0].innerHTML=`<div style="font-size:9px;color:#5a6f8e">📍 ENTRY PRICE</div><div style="font-size:18px;font-weight:900;color:#ffcc00;margin-top:4px">${s.entry}</div><div style="font-size:8px;color:#5a6f8e">New AI Entry</div>`;
 document.querySelectorAll('.sigItem')[1].innerHTML=`<div style="font-size:9px;color:#5a6f8e">🛑 STOP LOSS</div><div style="font-size:18px;font-weight:900;color:#ff3344;margin-top:4px">${s.sl}</div>`;
 document.querySelectorAll('.sigItem')[2].innerHTML=`<div style="font-size:9px;color:#5a6f8e">🎯 TAKE PROFIT 1</div><div style="font-size:18px;font-weight:900;color:#00e676;margin-top:4px">${s.tp1}</div>`;
 document.querySelectorAll('.sigItem')[3].innerHTML=`<div style="font-size:9px;color:#5a6f8e">🚀 TAKE PROFIT 2</div><div style="font-size:18px;font-weight:900;color:#00e676;margin-top:4px">${s.tp2}</div>`;
 speakSignal();
}

function shareSignal(){
 if(!currentSignal){alert('No live signal today - next signal in calendar');return;}
 let s=currentSignal;
 let txt=`🤖 MORGAN v21 FINAL - AUTO TODAY SIGNAL%0A%0A${s.news.type} LIVE NOW!%0APair: ${s.pair}%0ADirection: ${s.dir}%0A%0A📍 Entry: ${s.entry}%0A🛑 SL: ${s.sl} (30 pips)%0A🎯 TP1: ${s.tp1} (60 pips)%0A🚀 TP2: ${s.tp2} (100 pips)%0A%0AConfidence: ${s.conf}% AI%0AForecast: ${s.news.forecast}%0A${s.news.dev}%0A%0ARobot: https://n924-stack.github.io/fbs-ai-robot.html%0AM-Pesa: 0116162159`;
 window.open('https://wa.me/?text='+txt);
}

function openWA(msg){window.open('https://wa.me/254116162159?text='+encodeURIComponent(msg));}

function speakText(t){let u=new SpeechSynthesisUtterance(t);u.rate=0.92;u.pitch=0.9;document.getElementById('robot').classList.add('speakActive');u.onend=()=>{document.getElementById('robot').classList.remove('speakActive');};speechSynthesis.cancel();speechSynthesis.speak(u);}

function speakSignal(){
 if(!currentSignal){
   let todayStr=new Date().toISOString().split('T')[0];
   let next=newsDB.filter(n=>n.date>=todayStr)[0];
   let days=next?Math.ceil((new Date(next.date)-new Date(todayStr))/86400000):0;
   speakText(`Morgan final robot speaking. Next ${next?next.type:''} signal in ${days} days, ${next?next.date:''}. Auto entry ${next?genSignal(next).entry:''}. This is the best robot in Kenya!`);
   return;
 }
 let s=currentSignal;
 speakText(`${s.news.type} live signal! ${s.pair} ${s.dir} now. Entry price ${s.entry}. Stop loss ${s.sl}. Take profit one ${s.tp1}. Take profit two ${s.tp2}. Confidence ${s.conf} percent. ${s.news.dev}`);
}

function testLive(){
 testMode=!testMode;
 if(testMode){
   alert('🧪 TEST MODE ON! Now you see what clients will see on Oct 14 CPI Day - AUTO ENTRY/SL/TP!');
 } else {
   alert('Back to normal mode - showing countdown');
 }
 init();
}

init();
</script>
</body></html>
